<!DOCTYPE html>
<html>
<head>
    <title>Create Report - Busy Expense</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px;">
    
    <h2>Create Expense Report</h2>
    
    <form method="post" style="display: flex; flex-direction: column; gap: 15px;">
        {% csrf_token %}
        {{ form.as_p }}
        
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" style="padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">Save Report</button>
            <a href="{% url 'dashboard' %}" style="padding: 10px 15px; background: #6c757d; color: white; text-decoration: none; border-radius: 3px;">Cancel</a>
        </div>
    </form>

</body>
</html>
